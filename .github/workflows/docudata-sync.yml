name: DocuData Sync

on:
  push:
    branches: [main]

env:
  DOCUDATA_PROJECT_ID: 636c4d60-255c-4000-afa9-4e3ebbf6be42
  DOCUDATA_SPRINT_NUMERO: 1

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Enviar commit para DocuData
        run: |
          COMMIT_HASH=$(git log -1 --pretty=format:"%H")
          COMMIT_MSG=$(git log -1 --pretty=format:"%B")
          AUTHOR=$(git log -1 --pretty=format:"%an")
          DATE=$(git log -1 --pretty=format:"%ad")
          DIFF_STAT=$(git diff HEAD~1 HEAD --stat)
          DIFF=$(git diff HEAD~1 HEAD -- '*.py' '*.ts' '*.tsx' '*.js' '*.sql' | head -500)

          curl -f -X POST "https://agente-documentador-production.up.railway.app/ingest/commit" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg project_id "$DOCUDATA_PROJECT_ID" \
              --argjson sprint "$DOCUDATA_SPRINT_NUMERO" \
              --arg hash "$COMMIT_HASH" \
              --arg msg "$COMMIT_MSG" \
              --arg author "$AUTHOR" \
              --arg date "$DATE" \
              --arg stat "$DIFF_STAT" \
              --arg diff "$DIFF" \
              '{project_id: $project_id, sprint_number: $sprint, commit_hash: $hash, commit_message: $msg, author: $author, date: $date, diff_stat: $stat, diff: $diff}')"
